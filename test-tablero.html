<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tablero Kanban</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #2d1b69;
            margin: 0;
            padding: 20px;
            color: white;
        }
        
        .test-container {
            text-align: center;
            padding: 40px;
        }
        
        .test-title {
            font-size: 3em;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        .test-message {
            font-size: 1.5em;
            color: #ccc;
            margin-bottom: 30px;
        }
        
        .test-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .test-link:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="test-title">📋 Test Tablero Kanban</h1>
        <p class="test-message">Si puedes ver esta página, los cambios se están aplicando correctamente.</p>
        <a href="index.html" class="test-link">Ver Tablero Kanban</a>
    </div>

</html>
