<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Gestor de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .App {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .App-header {
            text-align: center;
            padding: 40px 20px 20px;
            color: white;
        }
        
        .App-header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .App-header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .App-main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .login-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .login-container h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        
        .mensaje {
            color: #666;
            margin-bottom: 25px;
            font-size: 1em;
        }
        
        .input-nombre {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        .input-nombre:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }
        
        .btn-login {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #ffcdd2;
            font-size: 14px;
        }
        
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #c8e6c9;
            font-size: 14px;
        }
        
        .logged-in-container {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
        }
        
        .logged-in-container h2 {
            color: #2e7d32;
        }
        
        .btn-logout {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }
        
        .btn-logout:hover {
            box-shadow: 0 5px 20px rgba(244, 67, 54, 0.4);
        }
        
        .lista-tareas-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .lista-tareas-container h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .formulario {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .input-tarea {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-tarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }
        
        .btn-agregar {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #4CAF50;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-agregar:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        .mensaje-vacio {
            text-align: center;
            color: #999;
            font-size: 1.2em;
            padding: 40px;
            background: #f5f5f5;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        @media (max-width: 600px) {
            .App-header h1 {
                font-size: 2em;
            }
            
            .App-header p {
                font-size: 1em;
            }
            
            .App-main {
                padding: 10px;
            }
            
            .login-container {
                margin: 10px;
                padding: 20px;
            }
            
            .login-container h2 {
                font-size: 1.5em;
            }
            
            .lista-tareas-container {
                margin: 10px;
                padding: 20px;
            }
            
            .lista-tareas-container h2 {
                font-size: 1.5em;
            }
            
            .formulario {
                flex-direction: column;
            }
            
            .btn-agregar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="App">
        <header class="App-header">
            <h1>📋 Gestor de Tareas</h1>
            <p>Organiza tu día de manera eficiente</p>
        </header>
        
        <main class="App-main">
            <div class="login-container">
                <h2>Por favor inicia sesión</h2>
                <p class="mensaje">Ingresa tus credenciales para acceder a tus tareas</p>
                <input type="text" placeholder="Nombre de usuario..." class="input-nombre" id="username">
                <input type="password" placeholder="Contraseña..." class="input-nombre" id="password">
                <button class="btn-login" id="loginBtn">Iniciar sesión</button>
                <div id="error-message" class="error-message" style="display: none;"></div>
            </div>
            
            <div class="lista-tareas-container">
                <h2>Lista de Tareas 📝</h2>
                <div class="formulario">
                    <input type="text" placeholder="Escribe una nueva tarea..." class="input-tarea">
                    <button class="btn-agregar">Agregar</button>
                </div>
                <p class="mensaje-vacio">No tienes tareas pendientes</p>
            </div>
        </main>
    </div>
    
    <script>
        // Usuarios válidos (en un proyecto real esto estaría en una base de datos)
        const usuariosValidos = {
            'admin': '123456',
            'usuario': 'password',
            'demo': 'demo123',
            'test': 'test123'
        };
        
        let usuarioActual = null;
        let tareas = JSON.parse(localStorage.getItem('tareas')) || [];
        
        // Cargar estado de sesión al iniciar
        function cargarEstadoSesion() {
            const sesionGuardada = localStorage.getItem('sesion');
            if (sesionGuardada) {
                const datos = JSON.parse(sesionGuardada);
                if (datos.usuario && datos.timestamp && (Date.now() - datos.timestamp) < 3600000) { // 1 hora
                    iniciarSesion(datos.usuario);
                }
            }
        }
        
        // Iniciar sesión
        function iniciarSesion(usuario) {
            usuarioActual = usuario;
            const loginContainer = document.querySelector('.login-container');
            loginContainer.innerHTML = `
                <h2>¡Bienvenido, ${usuario}! 👋</h2>
                <p class="mensaje">Has iniciado sesión correctamente</p>
                <button class="btn-login btn-logout" id="logoutBtn">Cerrar sesión</button>
            `;
            loginContainer.classList.add('logged-in-container');
            
            // Agregar evento de logout
            document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
            
            // Guardar sesión
            localStorage.setItem('sesion', JSON.stringify({
                usuario: usuario,
                timestamp: Date.now()
            }));
            
            // Mostrar tareas
            mostrarTareas();
        }
        
        // Cerrar sesión
        function cerrarSesion() {
            usuarioActual = null;
            localStorage.removeItem('sesion');
            location.reload();
        }
        
        // Validar credenciales
        function validarCredenciales(usuario, password) {
            return usuariosValidos[usuario] === password;
        }
        
        // Mostrar mensaje de error
        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = mensaje;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Mostrar tareas
        function mostrarTareas() {
            const tareasContainer = document.querySelector('.lista-tareas-container');
            if (tareas.length === 0) {
                tareasContainer.innerHTML = `
                    <h2>Lista de Tareas 📝</h2>
                    <div class="formulario">
                        <input type="text" placeholder="Escribe una nueva tarea..." class="input-tarea" id="nuevaTarea">
                        <button class="btn-agregar" id="agregarTarea">Agregar</button>
                    </div>
                    <p class="mensaje-vacio">No tienes tareas pendientes</p>
                `;
            } else {
                let htmlTareas = `
                    <h2>Lista de Tareas 📝</h2>
                    <div class="formulario">
                        <input type="text" placeholder="Escribe una nueva tarea..." class="input-tarea" id="nuevaTarea">
                        <button class="btn-agregar" id="agregarTarea">Agregar</button>
                    </div>
                    <ul class="lista-tareas">
                `;
                
                tareas.forEach((tarea, index) => {
                    htmlTareas += `
                        <li>
                            <span style="text-decoration: ${tarea.completada ? 'line-through' : 'none'}">
                                ${tarea.texto}
                            </span>
                            <div>
                                <button onclick="toggleCompletada(${index})" style="background: #4caf50; color: white; border: none; padding: 5px 10px; margin: 0 5px; border-radius: 5px; cursor: pointer;">
                                    ${tarea.completada ? '↩️' : '✓'}
                                </button>
                                <button onclick="eliminarTarea(${index})" style="background: #f44336; color: white; border: none; padding: 5px 10px; margin: 0 5px; border-radius: 5px; cursor: pointer;">
                                    🗑️
                                </button>
                            </div>
                        </li>
                    `;
                });
                
                htmlTareas += `
                    </ul>
                    <div class="estadisticas">
                        <p>Total: ${tareas.length} | Completadas: ${tareas.filter(t => t.completada).length} | Pendientes: ${tareas.filter(t => !t.completada).length}</p>
                    </div>
                `;
                
                tareasContainer.innerHTML = htmlTareas;
            }
            
            // Agregar evento de agregar tarea
            document.getElementById('agregarTarea').addEventListener('click', agregarTarea);
            document.getElementById('nuevaTarea').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    agregarTarea();
                }
            });
        }
        
        // Agregar tarea
        function agregarTarea() {
            const input = document.getElementById('nuevaTarea');
            const texto = input.value.trim();
            if (texto) {
                tareas.push({
                    id: Date.now(),
                    texto: texto,
                    completada: false
                });
                localStorage.setItem('tareas', JSON.stringify(tareas));
                mostrarTareas();
                input.value = '';
            }
        }
        
        // Toggle completada
        function toggleCompletada(index) {
            tareas[index].completada = !tareas[index].completada;
            localStorage.setItem('tareas', JSON.stringify(tareas));
            mostrarTareas();
        }
        
        // Eliminar tarea
        function eliminarTarea(index) {
            if (confirm('¿Estás seguro de que quieres eliminar esta tarea?')) {
                tareas.splice(index, 1);
                localStorage.setItem('tareas', JSON.stringify(tareas));
                mostrarTareas();
            }
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            cargarEstadoSesion();
            
            // Login
            document.getElementById('loginBtn').addEventListener('click', function() {
                const usuario = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                if (!usuario || !password) {
                    mostrarError('Por favor completa todos los campos');
                    return;
                }
                
                if (validarCredenciales(usuario, password)) {
                    iniciarSesion(usuario);
                } else {
                    mostrarError('Usuario o contraseña incorrectos');
                }
            });
            
            // Enter para login
            document.getElementById('username').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('password').focus();
                }
            });
            
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginBtn').click();
                }
            });
        });
    </script>
</body>
</html>
